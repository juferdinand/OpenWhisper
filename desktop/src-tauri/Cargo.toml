[package]
name = "openwhisper-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = []
custom-protocol = ["tauri/custom-protocol"]
vulkan = ["openwhisper-speech/vulkan"]
release-updater = []

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
openwhisper-core = { path = "../crates/core" }
openwhisper-speech = { path = "../crates/speech" }
tauri = { version = "2", features = ["tray-icon", "image-png", "unstable"] }
gtk = "0.18"
libloading = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["sync", "time", "rt-multi-thread", "fs", "io-util", "io-std", "process", "signal", "macros"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream", "json"] }
futures-util = "0.3"
cpal = "0.15"
rubato = "0.16"
directories = "6"
ashpd = { version = "0.13", default-features = false, features = ["tokio", "global_shortcuts", "remote_desktop", "screencast"] }
zbus = "5"
sha2 = "0.10"
uuid = { version = "1", features = ["v4"] }
tauri-plugin-updater = { version = "2.13.1", default-features = false, features = ["rustls-tls"] }
