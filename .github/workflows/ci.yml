name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '23 6 * * 1'

permissions:
  contents: read

jobs:
  linux:
    uses: ./.github/workflows/linux-build.yml
    with:
      artifact_name: OpenWhisper-Linux-development-${{ github.sha }}
  macos:
    runs-on: macos-15
    timeout-minutes: 30
    defaults:
      run:
        working-directory: macos
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'

      - name: Cache whisper.cpp
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: macos/Vendor
          key: whisper-${{ hashFiles('macos/scripts/fetch-whisper.sh') }}

      - name: Test
        timeout-minutes: 5
        run: |
          python3 ../shared/tests/check-local-processing-fixture.py
          make test

      - name: Build package (Universal, ad-hoc signed)
        run: make release UNIVERSAL=1

      - name: Verify installation image
        run: |
          bash scripts/test-signing-requirement.sh build/OpenWhisper.app
          bash scripts/verify-dmg.sh build/OpenWhisper-macOS.dmg build/OpenWhisper.app

      - name: Smoke test the shared UI in native WebKit
        timeout-minutes: 2
        env:
          WF_UI_SNAPSHOT_DIR: ${{ github.workspace }}/macos/build/ui-previews
        run: |
          build/OpenWhisper.app/Contents/MacOS/OpenWhisper --ui-smoke-test
          build/OpenWhisper.app/Contents/MacOS/OpenWhisper --overlay-smoke-test

      - name: Test native model communication from the bundled app
        timeout-minutes: 1
        env:
          WF_LOCAL_PROCESSING_FIXTURE: ${{ github.workspace }}/shared/tests/local-processing-server.py
        run: build/OpenWhisper.app/Contents/MacOS/OpenWhisper --local-processing-smoke-test

      - name: Upload native macOS UI previews
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: OpenWhisper-native-macOS-UI-${{ github.sha }}
          path: macos/build/ui-previews/*.png
          if-no-files-found: error
          retention-days: 14

      - name: Upload macOS package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: OpenWhisper-macOS-${{ github.sha }}
          path: |
            macos/build/OpenWhisper-macOS.dmg
            macos/build/OpenWhisper-macOS.zip
          if-no-files-found: error
          retention-days: 14
