name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '23 6 * * 1'

permissions:
  contents: read

jobs:
  electron:
    name: Electron TypeScript (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            electron/package-lock.json
            shared/ui/package-lock.json
      - name: Install locked development dependencies
        run: |
          npm ci --prefix shared/ui
          npm ci --prefix electron
      - name: Install native CPU and desktop validation tools (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y cmake ninja-build pkg-config libglib2.0-dev desktop-file-utils squashfs-tools
      - name: Check isolated Electron foundation
        working-directory: electron
        run: |
          npm run typecheck
          npm test
          npm run build
      - name: Check compiled stable migration and production stores
        if: runner.os == 'Linux'
        working-directory: electron
        run: node --import tsx tests/owned-stable-startup.ts
      - name: Install native CPU build tools (macOS)
        if: runner.os == 'macOS'
        run: brew list cmake ninja >/dev/null 2>&1 || brew install cmake ninja
      - name: Check native CPU binding with pinned public audio
        working-directory: electron
        env:
          OPENWHISPER_NATIVE_TEST_MODEL: ${{ github.workspace }}/electron/.local/speech-fixtures/ggml-tiny.bin
          OPENWHISPER_NATIVE_TEST_AUDIO: ${{ github.workspace }}/electron/.local/speech-fixtures/jfk.f32
        run: |
          npm run build:native
          node --import tsx scripts/fetch-speech-fixtures.ts
          node --import tsx --test tests/native-speech.test.ts
      - name: Assemble the normal Mac recording Dev build
        if: runner.os == 'macOS'
        working-directory: electron
        run: npm run build -- --recording
      - name: Build Linux bus and check native capture without devices
        if: runner.os == 'Linux'
        working-directory: electron
        run: |
          node --import tsx scripts/build-linux-bus.ts
          node --import tsx scripts/build-capture.ts
          OPENWHISPER_CAPTURE_SYNTHETIC_ADDON="$PWD/native/capture/build/openwhisper_capture.node" \
            node --import tsx --test tests/capture.test.ts
      - name: Assemble the canonical Linux Stable validation candidate
        if: runner.os == 'Linux'
        working-directory: electron
        env:
          OPENWHISPER_OWNED_SIGNED_DEBIAN: '1'
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          if test -n "$(git status --porcelain)"; then git status --short; exit 1; fi
          npm run setup
          npm run build -- --stable --recording
          if test -n "$(git status --porcelain)"; then git status --short; exit 1; fi
          node --import tsx scripts/package-linux-preview.ts \
            --output "$RUNNER_TEMP/openwhisper-linux-canonical" --canonical-stable-validation \
            > "$RUNNER_TEMP/openwhisper-linux-canonical-result.json"
          tools="$RUNNER_TEMP/openwhisper-appimage-tools"
          test ! -e "$tools"
          mkdir -m 700 "$tools"
          for component in appimagetool runtime; do
            if test "$component" = appimagetool; then filename=appimagetool-x86_64.AppImage; else filename=runtime-x86_64; fi
            url="$(jq -er ".$component.url" native/appimage-tools.json)"
            bytes="$(jq -er ".$component.bytes" native/appimage-tools.json)"
            digest="$(jq -er ".$component.sha256" native/appimage-tools.json)"
            curl --fail --location --proto '=https' --proto-redir '=https' --connect-timeout 15 --max-time 120 \
              --output "$tools/$filename" "$url"
            test "$(wc -c < "$tools/$filename")" -eq "$bytes"
            printf '%s  %s\n' "$digest" "$tools/$filename" | sha256sum --check --status
            chmod 755 "$tools/$filename"
          done
          extractor_status=0
          unsquashfs -version > "$RUNNER_TEMP/openwhisper-appimage-extractor.txt" 2>&1 || extractor_status=$?
          test "$extractor_status" -eq 0 || test "$extractor_status" -eq 1
          IFS= read -r extractor_version < "$RUNNER_TEMP/openwhisper-appimage-extractor.txt"
          [[ "$extractor_version" == "unsquashfs version "[0-9]* ]]
          printf 'versionExitCode=%s\n' "$extractor_status" >> "$RUNNER_TEMP/openwhisper-appimage-extractor.txt"
          sha256sum "$(command -v unsquashfs)" >> "$RUNNER_TEMP/openwhisper-appimage-extractor.txt"
          node --import tsx scripts/package-linux-appimage.ts \
            --directory "$RUNNER_TEMP/openwhisper-linux-canonical/OpenWhisper-Linux-x64" \
            --output "$RUNNER_TEMP/openwhisper-linux-canonical/appimage" --tools "$tools" --canonical-stable-validation \
            > "$RUNNER_TEMP/openwhisper-linux-canonical-appimage-result.json"
          node_modules/.bin/esbuild tests/owned-signed-debian.ts \
            --bundle --platform=node --format=esm --target=node24 --external:original-fs \
            --outfile="$RUNNER_TEMP/owned-signed-debian.mjs"
          node "$RUNNER_TEMP/owned-signed-debian.mjs" capture --candidate "$RUNNER_TEMP/openwhisper-linux-canonical"
          node "$RUNNER_TEMP/owned-signed-debian.mjs" capture --candidate "$RUNNER_TEMP/openwhisper-linux-canonical" --package appimage
          tar -C "$RUNNER_TEMP/openwhisper-linux-canonical" -cf "$RUNNER_TEMP/openwhisper-linux-canonical.tar" \
            OpenWhisper-Linux-amd64.deb OpenWhisper-Linux-x64 candidate-receipt.json appimage-candidate-receipt.json \
            appimage/OpenWhisper-Linux-x86_64.AppImage appimage/openwhisper-launch appimage/receipt.json \
            appimage/construction-command.json appimage/passive-extraction-command.json
      - name: Upload the same-run canonical Linux candidate
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: OpenWhisper-canonical-Linux-${{ github.sha }}
          path: |
            ${{ runner.temp }}/openwhisper-linux-canonical.tar
            ${{ runner.temp }}/openwhisper-linux-canonical-result.json
            ${{ runner.temp }}/openwhisper-linux-canonical-appimage-result.json
            ${{ runner.temp }}/openwhisper-appimage-extractor.txt
            ${{ runner.temp }}/owned-signed-debian.mjs
          if-no-files-found: error
          retention-days: 14
  mac_capture:
    name: Electron owned Mac native tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-15-intel]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.21.0'
          cache: npm
          cache-dependency-path: |
            electron/package-lock.json
            shared/ui/package-lock.json
      - name: Install locked development dependencies and pinned runtime
        run: |
          npm ci --prefix shared/ui
          npm ci --prefix electron
          npm run setup --prefix electron
      - name: Check and build the isolated TypeScript host
        working-directory: electron
        run: |
          npm run typecheck
          npm test
          npm run build
      - name: Install native capture build tools
        run: brew list cmake ninja >/dev/null 2>&1 || brew install cmake ninja
      - name: Check compiled Mac migration with owned paths and read-only native admission
        working-directory: electron
        run: node --import tsx tests/owned-stable-startup.ts
      - name: Build the Apple capture edge and test generated PCM without devices
        working-directory: electron
        env:
          OPENWHISPER_OWNED_MAC_CAPTURE_TEST: '1'
          OPENWHISPER_MAC_CAPTURE_EVIDENCE: ${{ github.workspace }}/electron/.local/macos-capture-evidence
        run: |
          node --import tsx scripts/build-macos-capture.ts
          node --import tsx --test tests/owned-macos-capture.test.ts
      - name: Upload synthetic capture provenance and categorical results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Electron-macOS-capture-${{ matrix.os }}-${{ github.sha }}
          path: |
            electron/.local/macos-capture-evidence/
            electron/native/macos-capture/build/*/build-manifest.json
            electron/native/macos-capture/build/*/compile_commands.json
            electron/native/macos-capture/build/*/openwhisper_macos_capture.node
            electron/dist/native/macos-capture-notices/
          if-no-files-found: warn
          retention-days: 14
      - name: Build and test the owned Mac process retirement probe
        working-directory: electron
        env:
          OPENWHISPER_OWNED_MAC_RETIREMENT_TEST: '1'
          OPENWHISPER_MAC_RETIREMENT_EVIDENCE: ${{ github.workspace }}/electron/.local/owned-mac-retirement
        run: |
          node --import tsx scripts/build-macos-retirement.ts
          node --import tsx --test tests/owned-macos-retirement.test.ts
      - name: Upload owned Mac process retirement provenance and results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Electron-macOS-retirement-${{ matrix.os }}-${{ github.sha }}
          path: |
            electron/.local/owned-mac-retirement/
            electron/dist/native/openwhisper_macos_retirement_probe.node
            electron/dist/native/macos-retirement-probe-notices/
            electron/native/macos-retirement/build/*/compile_commands.json
          if-no-files-found: warn
          retention-days: 14
      - name: Build and test the distinct production Mac retirement role
        working-directory: electron
        env:
          OPENWHISPER_OWNED_MAC_PRODUCTION_RETIREMENT_TEST: '1'
          OPENWHISPER_MAC_PRODUCTION_RETIREMENT_EVIDENCE: ${{ github.workspace }}/electron/.local/owned-mac-production-retirement
        run: |
          node --import tsx scripts/build-macos-retirement-production.ts
          node --import tsx --test tests/owned-macos-production-retirement.test.ts
      - name: Upload production Mac retirement role provenance and results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Electron-macOS-production-retirement-${{ matrix.os }}-${{ github.sha }}
          path: |
            electron/.local/owned-mac-production-retirement/
            electron/dist/native/openwhisper_macos_retirement.node
            electron/dist/native/macos-retirement-notices/
            electron/native/macos-retirement/build-production/*/build-manifest.json
            electron/native/macos-retirement/build-production/*/compile_commands.json
            electron/native/macos-retirement/build-production/*/openwhisper_macos_retirement.node
          if-no-files-found: warn
          retention-days: 14
      - name: Assemble the per-architecture Mac recording Dev app
        working-directory: electron
        env:
          OPENWHISPER_OWNED_MAC_PACKAGE_SMOKE: '1'
        run: |
          npm run build -- --recording
          node --import tsx scripts/fetch-speech-fixtures.ts
          node --import tsx scripts/package-macos-preview.ts --output "$RUNNER_TEMP/openwhisper-mac-dev" > "$RUNNER_TEMP/openwhisper-mac-dev-result.json"
          node --import tsx tests/owned-macos-package-smoke.ts --package "$RUNNER_TEMP/openwhisper-mac-dev/OpenWhisper Dev.app" --evidence "$RUNNER_TEMP/openwhisper-mac-smoke" --fixtures "$PWD/.local/speech-fixtures"
      - name: Upload the isolated ad-hoc Mac Dev package
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: OpenWhisper-Dev-macOS-${{ matrix.os }}-${{ github.sha }}
          path: |
            ${{ runner.temp }}/openwhisper-mac-dev/*.zip
            ${{ runner.temp }}/openwhisper-mac-dev-result.json
            ${{ runner.temp }}/openwhisper-mac-smoke/result.json
            ${{ runner.temp }}/openwhisper-mac-smoke/failure.png
          if-no-files-found: error
          retention-days: 14
      - name: Assemble and check the normal stable Mac validation app
        working-directory: electron
        env:
          OPENWHISPER_OWNED_MAC_PACKAGE_SMOKE: '1'
        run: |
          if test -n "$(git status --porcelain)"; then
            git status --short
            exit 1
          fi
          npm run build -- --recording --stable
          node --import tsx scripts/package-macos-preview.ts --output "$RUNNER_TEMP/openwhisper-mac-stable" > "$RUNNER_TEMP/openwhisper-mac-stable-result.json"
          node --import tsx tests/owned-macos-package-smoke.ts --package "$RUNNER_TEMP/openwhisper-mac-stable/OpenWhisper.app" --evidence "$RUNNER_TEMP/openwhisper-mac-stable-smoke" --fixtures "$PWD/.local/speech-fixtures" --variant stable
      - name: Build a private same-source signed-update successor from the warm arm64 builder
        if: matrix.os == 'macos-15'
        working-directory: electron
        env:
          OPENWHISPER_OWNED_MAC_SUCCESSOR: '1'
        run: node --import tsx scripts/prepare-owned-macos-successor.ts --output "$RUNNER_TEMP/openwhisper-mac-successor"
      - name: Upload private successor inputs for the owned publisher job
        if: matrix.os == 'macos-15'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: OpenWhisper-private-macOS-successor-${{ github.sha }}
          path: |
            ${{ runner.temp }}/openwhisper-mac-successor/package/*.zip
            ${{ runner.temp }}/openwhisper-mac-successor/package-result.json
            ${{ runner.temp }}/openwhisper-mac-successor/native-build.log
            ${{ runner.temp }}/openwhisper-mac-successor/successor.bundle
            ${{ runner.temp }}/openwhisper-mac-successor/successor-source.json
          if-no-files-found: error
          retention-days: 14
      - name: Upload the separate ad-hoc stable Mac validation package and evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: OpenWhisper-validation-macOS-${{ matrix.os }}-${{ github.sha }}
          path: |
            ${{ runner.temp }}/openwhisper-mac-stable/*.zip
            ${{ runner.temp }}/openwhisper-mac-stable-result.json
            ${{ runner.temp }}/openwhisper-mac-stable-smoke/result.json
            ${{ runner.temp }}/openwhisper-mac-stable-smoke/failure.png
          if-no-files-found: warn
          retention-days: 14
  mac_universal_construct:
    name: Electron universal Mac construction
    needs: mac_capture
    runs-on: macos-15
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.21.0'
          cache: npm
          cache-dependency-path: electron/package-lock.json
      - name: Install locked construction tools without rebuilding thin apps
        run: npm ci --prefix electron
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: OpenWhisper-validation-macOS-macos-15-${{ github.sha }}
          path: ${{ runner.temp }}/thin-arm64
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: OpenWhisper-validation-macOS-macos-15-intel-${{ github.sha }}
          path: ${{ runner.temp }}/thin-x64
      - name: Construct and verify one same-source universal validation ZIP
        working-directory: electron
        shell: bash
        env:
          OPENWHISPER_UNIVERSAL_DIAGNOSTIC: ${{ runner.temp }}/openwhisper-mac-universal-failure.json
        run: |
          set -euo pipefail
          shopt -s nullglob
          for architecture in arm64 x64; do
            input="$RUNNER_TEMP/thin-$architecture"
            archives=("$input"/openwhisper-mac-stable/*.zip "$input"/*.zip)
            test "${#archives[@]}" -eq 1
            test "$(/usr/bin/plutil -extract status raw -o - "$input/openwhisper-mac-stable-smoke/result.json")" = PASS
            test "$(/usr/bin/plutil -extract architecture raw -o - "$input/openwhisper-mac-stable-smoke/result.json")" = "$architecture"
            /usr/bin/shasum -a 256 "${archives[0]}" > "$input/original-archive.sha256"
            /usr/bin/ditto -x -k "${archives[0]}" "$RUNNER_TEMP/extracted-$architecture"
            test "$(/usr/bin/plutil -extract commit raw -o - "$RUNNER_TEMP/extracted-$architecture/OpenWhisper.app/Contents/Resources/app/dist/resources/development-build.json")" = "$GITHUB_SHA"
          done
          node --import tsx scripts/package-macos-universal.ts \
            --arm64-app "$RUNNER_TEMP/extracted-arm64/OpenWhisper.app" \
            --x64-app "$RUNNER_TEMP/extracted-x64/OpenWhisper.app" \
            --output "$RUNNER_TEMP/openwhisper-mac-universal" \
            > "$RUNNER_TEMP/openwhisper-mac-universal-result.json"
      - name: Retain the bounded universal construction failure diagnostic
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Electron-universal-construction-diagnostic-${{ github.sha }}
          path: ${{ runner.temp }}/openwhisper-mac-universal-failure.json
          if-no-files-found: warn
          retention-days: 14
      - name: Upload the verified universal ZIP and original producer receipts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: OpenWhisper-validation-macOS-universal-${{ github.sha }}
          path: |
            ${{ runner.temp }}/openwhisper-mac-universal/*.zip
            ${{ runner.temp }}/openwhisper-mac-universal-result.json
            ${{ runner.temp }}/thin-arm64/original-archive.sha256
            ${{ runner.temp }}/thin-arm64/openwhisper-mac-stable-result.json
            ${{ runner.temp }}/thin-arm64/openwhisper-mac-stable-smoke/result.json
            ${{ runner.temp }}/thin-x64/original-archive.sha256
            ${{ runner.temp }}/thin-x64/openwhisper-mac-stable-result.json
            ${{ runner.temp }}/thin-x64/openwhisper-mac-stable-smoke/result.json
          if-no-files-found: error
          retention-days: 14
  mac_universal_runtime:
    name: Electron owned universal Mac (${{ matrix.os }})
    needs: mac_universal_construct
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-15-intel]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.21.0'
          cache: npm
          cache-dependency-path: electron/package-lock.json
      - name: Install locked test tools without rebuilding the app
        run: npm ci --prefix electron
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: OpenWhisper-validation-macOS-universal-${{ github.sha }}
          path: ${{ runner.temp }}/universal-input
      - name: Check the identical universal ZIP through the normal stable main
        working-directory: electron
        shell: bash
        env:
          OPENWHISPER_OWNED_MAC_PACKAGE_SMOKE: '1'
        run: |
          set -euo pipefail
          shopt -s nullglob
          input="$RUNNER_TEMP/universal-input"
          archives=("$input"/openwhisper-mac-universal/*.zip "$input"/*.zip)
          test "${#archives[@]}" -eq 1
          expected="$(/usr/bin/plutil -extract sha256 raw -o - "$input/openwhisper-mac-universal-result.json")"
          actual="$(/usr/bin/shasum -a 256 "${archives[0]}" | cut -d ' ' -f 1)"
          test "$actual" = "$expected"
          /usr/bin/ditto -x -k "${archives[0]}" "$RUNNER_TEMP/universal-extracted"
          test "$(/usr/bin/plutil -extract commit raw -o - "$RUNNER_TEMP/universal-extracted/OpenWhisper.app/Contents/Resources/app/dist/resources/development-build.json")" = "$GITHUB_SHA"
          node --import tsx scripts/fetch-speech-fixtures.ts
          node --import tsx tests/owned-macos-package-smoke.ts \
            --package "$RUNNER_TEMP/universal-extracted/OpenWhisper.app" \
            --evidence "$RUNNER_TEMP/openwhisper-mac-universal-smoke" \
            --fixtures "$PWD/.local/speech-fixtures" --variant stable --package-format universal
      - name: Upload original universal runtime results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Electron-universal-macOS-${{ matrix.os }}-${{ github.sha }}
          path: |
            ${{ runner.temp }}/openwhisper-mac-universal-smoke/result.json
            ${{ runner.temp }}/openwhisper-mac-universal-smoke/failure.png
          if-no-files-found: warn
          retention-days: 14
  mac_persistent_publisher:
    name: Owned persistent Mac publisher validation
    needs: mac_capture
    if: >-
      github.actor == github.repository_owner && github.actor != 'dependabot[bot]' &&
      ((github.event_name == 'pull_request' &&
        github.event.pull_request.user.login == github.repository_owner &&
        github.event.pull_request.user.login != 'dependabot[bot]' &&
        github.event.pull_request.head.repo.full_name == github.repository &&
        github.event.pull_request.head.repo.fork == false) ||
       (github.event_name == 'push' && github.ref == 'refs/heads/main'))
    runs-on: macos-15
    timeout-minutes: 15
    env:
      OPENWHISPER_OWNED_MAC_PUBLISHER: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.21.0'
          cache: npm
          cache-dependency-path: electron/package-lock.json
      - name: Install locked tools without rebuilding thin apps
        run: |
          npm ci --prefix shared/ui
          npm ci --prefix electron
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: OpenWhisper-validation-macOS-macos-15-${{ github.sha }}
          path: ${{ runner.temp }}/publisher-thin-arm64
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: OpenWhisper-private-macOS-successor-${{ github.sha }}
          path: ${{ runner.temp }}/publisher-successor
      - name: Reconstruct the genuine 0.3.1 source from the same-run arm64 artifact
        working-directory: electron
        env:
          OPENWHISPER_OWNED_MAC_PUBLISHER: '1'
        run: node --import tsx scripts/prepare-owned-macos-publisher-source.ts \
          --artifact "$RUNNER_TEMP/publisher-successor" --output "$RUNNER_TEMP/publisher-successor-source"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: OpenWhisper-validation-macOS-macos-15-intel-${{ github.sha }}
          path: ${{ runner.temp }}/publisher-thin-x64
      - name: Admit exact same-run thin inputs before signing credentials
        working-directory: electron
        shell: bash
        env:
          API_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain)"
          umask 077
          mkdir "$RUNNER_TEMP/mac-publisher-private" "$RUNNER_TEMP/mac-publisher-evidence"
          private="$RUNNER_TEMP/mac-publisher-private"
          cat > "$private/cleanup.sh" <<'CLEANUP'
          set -euo pipefail
          private="$RUNNER_TEMP/mac-publisher-private"
          evidence="$RUNNER_TEMP/mac-publisher-evidence"
          failed=0
          if test -f "$private/previous-keychains"; then
            previous=()
            while IFS= read -r keychain; do previous+=("$keychain"); done < "$private/previous-keychains"
            /usr/bin/security list-keychains -d user -s "${previous[@]}" >/dev/null 2>&1 || failed=1
          fi
          if test -e "$private/signing.keychain-db"; then
            /usr/bin/security delete-keychain "$private/signing.keychain-db" >/dev/null 2>&1 || failed=1
          fi
          rm -f "$private/cert.p12" "$private/previous-keychains.partial" || failed=1
          test ! -e "$private/cert.p12" && test ! -e "$private/signing.keychain-db" || failed=1
          if test "$failed" -ne 0; then touch "$evidence/cleanup-failed"; fi
          if test -e "$evidence/cleanup-failed"; then
            printf '%s\n' '{"status":"FAIL","scope":"Temporary signing material cleanup"}' > "$evidence/cleanup.json"
            printf '%s\n' '::error::Temporary Mac signing material cleanup failed.'
            exit 1
          fi
          printf '%s\n' '{"status":"PASS","scope":"Temporary keychain removed; original search list restored; P12 removed"}' > "$evidence/cleanup.json"
          CLEANUP
          umask 022
          node --import tsx tests/owned-macos-publisher.ts admit
      - name: Admit the unchanged pinned 0.2.5 release binary and original source oracle
        working-directory: electron
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          umask 077
          private="$RUNNER_TEMP/mac-publisher-private"
          evidence="$RUNNER_TEMP/mac-publisher-evidence"
          gh api repos/juferdinand/OpenWhisper/releases/tags/v0.2.5 > "$evidence/old-release-api.json"
          gh api repos/juferdinand/OpenWhisper/git/ref/tags/v0.2.5 > "$evidence/old-tag-api.json"
          curl --fail --silent --show-error --location --proto '=https' --tlsv1.2 --max-time 60 \
            https://raw.githubusercontent.com/juferdinand/OpenWhisper/d69b43bf6e7017c61089e117e79af34f57f297c4/macos/Sources/OpenWhisper/Services/UpdateService.swift \
            -o "$evidence/old-UpdateService.swift"
          curl --fail --silent --show-error --location --proto '=https' --tlsv1.2 --max-time 60 \
            https://raw.githubusercontent.com/juferdinand/OpenWhisper/d69b43bf6e7017c61089e117e79af34f57f297c4/macos/Sources/OpenWhisperCore/UpdateSignatureVerifier.swift \
            -o "$evidence/old-UpdateSignatureVerifier.swift"
          curl --fail --silent --show-error --location --proto '=https' --tlsv1.2 --max-time 120 \
            https://github.com/juferdinand/OpenWhisper/releases/download/v0.2.5/OpenWhisper-macOS.zip -o "$private/old-release.zip"
          node --import tsx tests/owned-macos-publisher.ts oracle
      - name: Sign the admitted universal candidate and check the old publisher requirement
        id: publisher
        working-directory: electron
        shell: bash
        env:
          CERT_P12: ${{ secrets.SIGNING_CERT_P12 }}
          CERT_PASSWORD: ${{ secrets.SIGNING_CERT_PASSWORD }}
          OPENWHISPER_UNIVERSAL_DIAGNOSTIC: ${{ runner.temp }}/mac-publisher-evidence/construction-failure.json
        run: |
          set -euo pipefail
          set +x
          umask 077
          private="$RUNNER_TEMP/mac-publisher-private"
          evidence="$RUNNER_TEMP/mac-publisher-evidence"
          trap 'status=$?; trap - EXIT; if ! /bin/bash "$private/cleanup.sh"; then status=1; fi; exit "$status"' EXIT
          trap 'exit 130' INT
          trap 'exit 143' TERM
          if test -z "$CERT_P12" || test -z "$CERT_PASSWORD"; then
            printf '%s\n' '{"status":"UNAVAILABLE","reason":"PERSISTENT_SIGNING_CREDENTIALS_MISSING","scope":"No persistent publisher acceptance"}' > "$evidence/signing.json"
            printf '%s\n' 'available=false' >> "$GITHUB_OUTPUT"
            printf '%s\n' '::notice::Persistent Mac publisher validation is unavailable: existing signing credentials were not supplied.'
            exit 0
          fi
          LC_ALL=C /usr/bin/security list-keychains -d user | node --import tsx tests/owned-macos-publisher.ts keychain-list > "$private/previous-keychains.partial"
          mv "$private/previous-keychains.partial" "$private/previous-keychains"
          keychain="$private/signing.keychain-db"
          password="$(uuidgen)"
          printf '::add-mask::%s\n' "$password"
          if ! printf '%s' "$CERT_P12" | /usr/bin/base64 --decode > "$private/cert.p12" 2>/dev/null; then
            printf '%s\n' '::error::Persistent Mac certificate decoding failed.'
            exit 1
          fi
          if ! /usr/bin/security create-keychain -p "$password" "$keychain" >/dev/null 2>&1 ||
             ! /usr/bin/security set-keychain-settings -lut 900 "$keychain" >/dev/null 2>&1 ||
             ! /usr/bin/security unlock-keychain -p "$password" "$keychain" >/dev/null 2>&1 ||
             ! /usr/bin/security import "$private/cert.p12" -k "$keychain" -P "$CERT_PASSWORD" -T /usr/bin/codesign >/dev/null 2>&1 ||
             ! /usr/bin/security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$password" "$keychain" >/dev/null 2>&1; then
            printf '%s\n' '::error::Persistent Mac certificate import failed.'
            exit 1
          fi
          rm "$private/cert.p12"
          unset CERT_P12 CERT_PASSWORD password
          previous=()
          while IFS= read -r path; do previous+=("$path"); done < "$private/previous-keychains"
          /usr/bin/security list-keychains -d user -s "$keychain" "${previous[@]}" >/dev/null 2>&1
          if ! SIGN_IDENTITY="$(LC_ALL=C /usr/bin/security find-identity -p codesigning "$keychain" 2>/dev/null | node --import tsx tests/owned-macos-publisher.ts keychain-identity)"; then
            printf '%s\n' '::error::Persistent Mac validation requires exactly one usable imported signing identity.'
            exit 1
          fi
          export SIGN_IDENTITY
          umask 022
          node --import tsx scripts/package-macos-universal.ts \
            --arm64-app "$RUNNER_TEMP/publisher-extracted-arm64/OpenWhisper.app" \
            --x64-app "$RUNNER_TEMP/publisher-extracted-x64/OpenWhisper.app" \
            --output "$RUNNER_TEMP/mac-publisher-output" --signing-mode persistent-validation --enable-updates \
            > "$evidence/package-result.json"
          umask 077
          original="$private/old-release/OpenWhisper.app"
          successor_source="$(jq -er .source "$RUNNER_TEMP/publisher-successor-source/source-path.json")"
          /bin/bash ../macos/scripts/test-release-signature.sh "$RUNNER_TEMP/mac-publisher-output/OpenWhisper.app" "$original" > "$evidence/old-requirement-staged.json"
          /bin/bash ../macos/scripts/test-release-signature.sh "$RUNNER_TEMP/mac-publisher-output/archive-check/OpenWhisper.app" "$original" > "$evidence/old-requirement-zip.json"
          node --import tsx scripts/package-owned-macos-successor.ts \
            --source "$successor_source" --output "$RUNNER_TEMP/mac-publisher-successor" \
            > "$evidence/successor-package-result.json"
          /bin/bash ../macos/scripts/test-release-signature.sh "$RUNNER_TEMP/mac-publisher-successor/OpenWhisper.app" "$original" > "$evidence/successor-old-requirement-staged.json"
          /bin/bash ../macos/scripts/test-release-signature.sh "$RUNNER_TEMP/mac-publisher-successor/archive-check/OpenWhisper.app" "$original" > "$evidence/successor-old-requirement-zip.json"
          /bin/bash "$private/cleanup.sh"
          trap - EXIT INT TERM
          /usr/bin/git worktree remove --force "$successor_source"
          printf '%s\n' '{"status":"SIGNED","scope":"Persistent Universal 0.3.0 package and private arm64 thin 0.3.1 successor satisfy the original 0.2.5 requirement under the same identity; actual update handoff is measured separately"}' > "$evidence/signing.json"
          printf '%s\n' 'available=true' >> "$GITHUB_OUTPUT"
      - name: Always remove owned signing material and restore keychain state
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if test -f "$RUNNER_TEMP/mac-publisher-private/cleanup.sh"; then
            /bin/bash "$RUNNER_TEMP/mac-publisher-private/cleanup.sh"
          fi
      - name: Measure actual persistent self and original-fd3 ZIP publisher admission
        if: steps.publisher.outputs.available == 'true'
        working-directory: electron
        shell: bash
        env:
          OPENWHISPER_OWNED_MAC_PACKAGE_SMOKE: '1'
        run: |
          set -euo pipefail
          node --import tsx tests/owned-macos-publisher.ts runtime-input
          node --import tsx scripts/fetch-speech-fixtures.ts
          node --import tsx tests/owned-macos-package-smoke.ts \
            --package "$RUNNER_TEMP/mac-publisher-runtime/OpenWhisper.app" \
            --evidence "$RUNNER_TEMP/mac-publisher-smoke" \
            --fixtures "$PWD/.local/speech-fixtures" --variant stable --package-format universal
          node --import tsx tests/owned-macos-publisher.ts result
      - name: Install and relaunch one genuine same-identity successor on the owned Mac slot
        if: steps.publisher.outputs.available == 'true'
        working-directory: electron
        shell: bash
        env:
          OPENWHISPER_OWNED_MAC_UPDATE_TEST: '1'
        run: |
          set -euo pipefail
          shopt -s nullglob
          archives=("$RUNNER_TEMP/mac-publisher-successor"/*.zip)
          test "${#archives[@]}" -eq 1
          node --import tsx tests/owned-macos-update-handoff.ts \
            --package "$RUNNER_TEMP/mac-publisher-output/OpenWhisper.app" \
            --successor "${archives[0]}" \
            --evidence "$RUNNER_TEMP/mac-publisher-update-handoff"
      - name: Upload only public publisher receipts after signing cleanup
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: OpenWhisper-persistent-Mac-publisher-${{ github.sha }}
          path: |
            ${{ runner.temp }}/mac-publisher-evidence/*.json
            ${{ runner.temp }}/mac-publisher-evidence/*.sha256
            ${{ runner.temp }}/mac-publisher-evidence/old-UpdateService.swift
            ${{ runner.temp }}/mac-publisher-evidence/old-UpdateSignatureVerifier.swift
            ${{ runner.temp }}/mac-publisher-smoke/result.json
            ${{ runner.temp }}/mac-publisher-update-handoff/result.json
          if-no-files-found: warn
          retention-days: 14
  linux:
    uses: ./.github/workflows/linux-build.yml
    with:
      artifact_name: OpenWhisper-Linux-development-${{ github.sha }}
  linux_signed_candidate:
    name: Owned signed Electron Linux candidates
    needs: [electron, linux]
    if: >-
      github.actor == github.repository_owner && github.actor != 'dependabot[bot]' &&
      ((github.event_name == 'pull_request' &&
        github.event.pull_request.user.login == github.repository_owner &&
        github.event.pull_request.user.login != 'dependabot[bot]' &&
        github.event.pull_request.head.repo.full_name == github.repository &&
        github.event.pull_request.head.repo.fork == false) ||
       (github.event_name == 'push' && github.ref == 'refs/heads/main'))
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.21.0'
      - name: Download the same-run canonical candidate
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: OpenWhisper-canonical-Linux-${{ github.sha }}
          path: ${{ runner.temp }}/signed-candidate-packet
      - name: Download the same-run locked signing tools
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: OpenWhisper-Linux-update-tools-${{ github.sha }}
          path: ${{ runner.temp }}/signed-tools-packet
      - name: Admit source, native inputs, canonical package and locked tools before secrets
        env:
          OPENWHISPER_OWNED_SIGNED_DEBIAN: '1'
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          if test -n "$(git status --porcelain)"; then git status --short; exit 1; fi
          mkdir -m 700 "$RUNNER_TEMP/signed-candidate" "$RUNNER_TEMP/signed-tools" "$RUNNER_TEMP/signed-evidence"
          tar -xf "$RUNNER_TEMP/signed-candidate-packet/openwhisper-linux-canonical.tar" -C "$RUNNER_TEMP/signed-candidate"
          tar -xf "$RUNNER_TEMP/signed-tools-packet/openwhisper-update-tools.tar" -C "$RUNNER_TEMP/signed-tools"
          node "$RUNNER_TEMP/signed-candidate-packet/owned-signed-debian.mjs" admit \
            --candidate "$RUNNER_TEMP/signed-candidate" --tools "$RUNNER_TEMP/signed-tools" \
            --evidence "$RUNNER_TEMP/signed-evidence/admission"
          node "$RUNNER_TEMP/signed-candidate-packet/owned-signed-debian.mjs" admit \
            --candidate "$RUNNER_TEMP/signed-candidate" --tools "$RUNNER_TEMP/signed-tools" \
            --evidence "$RUNNER_TEMP/signed-evidence/appimage-admission" --package appimage
      - name: Sign only the admitted canonical candidate with the existing key
        id: sign
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          if test -z "$TAURI_SIGNING_PRIVATE_KEY"; then
            printf '%s\n' '{"status":"UNAVAILABLE","reason":"SIGNING_KEY_UNAVAILABLE","scope":"No signed candidate or installed-positive evidence"}' > "$RUNNER_TEMP/signed-evidence/signing.json"
            printf '%s\n' 'available=false' >> "$GITHUB_OUTPUT"
            printf '%s\n' '::notice::Signed Electron candidate evidence is unavailable: the existing signing key was not supplied.'
            exit 0
          fi
          version="$(cat VERSION)"
          if ! node "$RUNNER_TEMP/signed-tools/node_modules/@tauri-apps/cli/tauri.js" signer sign \
            --app-version "$version" "$RUNNER_TEMP/signed-candidate/OpenWhisper-Linux-amd64.deb" >/dev/null 2>&1; then
            printf '%s\n' '::error::The admitted candidate signing step failed.'
            exit 1
          fi
          if ! node "$RUNNER_TEMP/signed-tools/node_modules/@tauri-apps/cli/tauri.js" signer sign \
            --app-version "$version" "$RUNNER_TEMP/signed-candidate/appimage/OpenWhisper-Linux-x86_64.AppImage" >/dev/null 2>&1; then
            printf '%s\n' '::error::The admitted AppImage signing step failed.'
            exit 1
          fi
          printf '%s\n' '{"status":"SIGNED","scope":"Private canonical Debian and AppImage; no AppImage runtime, migration or upgrade evidence"}' > "$RUNNER_TEMP/signed-evidence/signing.json"
          printf '%s\n' 'available=true' >> "$GITHUB_OUTPUT"
      - name: Verify exact signed bytes and version with embedded Electron and the existing Rust oracle
        if: steps.sign.outputs.available == 'true'
        env:
          OPENWHISPER_OWNED_SIGNED_DEBIAN: '1'
        run: |
          node "$RUNNER_TEMP/signed-candidate-packet/owned-signed-debian.mjs" verify \
            --candidate "$RUNNER_TEMP/signed-candidate" --tools "$RUNNER_TEMP/signed-tools" \
            --evidence "$RUNNER_TEMP/signed-evidence/verification"
          node "$RUNNER_TEMP/signed-candidate-packet/owned-signed-debian.mjs" verify \
            --candidate "$RUNNER_TEMP/signed-candidate" --tools "$RUNNER_TEMP/signed-tools" \
            --evidence "$RUNNER_TEMP/signed-evidence/appimage-verification" --package appimage
      - name: Install and audit only inside the original disposable Ubuntu namespace
        if: steps.sign.outputs.available == 'true'
        env:
          OPENWHISPER_OWNED_SIGNED_DEBIAN: '1'
        run: |
          namespace="openwhisper-signed-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          cleanup() {
            status=$?
            trap - EXIT
            printf '%s\n' "$status" > "$RUNNER_TEMP/signed-evidence/original-step-exit.txt"
            if test -n "${original_container:-}"; then
              if ! docker inspect "$original_container" > "$RUNNER_TEMP/signed-evidence/container-inspect.json"; then status=1; fi
              if ! docker cp "$original_container:/owned-evidence/." "$RUNNER_TEMP/signed-evidence/installed" >/dev/null 2>&1; then status=1; fi
              if docker rm -f "$original_container" >/dev/null; then
                printf '%s\n' '{"originalContainerRemoved":true}' > "$RUNNER_TEMP/signed-evidence/container-removal.json"
              else
                status=1
              fi
            fi
            exit "$status"
          }
          trap cleanup EXIT
          original_container="$(docker create --name "$namespace" --platform linux/amd64 \
            --network bridge --cap-drop ALL --cap-add CHOWN --cap-add DAC_OVERRIDE --cap-add FOWNER --cap-add SETUID --cap-add SETGID \
            --security-opt no-new-privileges --pids-limit 128 --memory 2g \
            --mount "type=bind,src=$RUNNER_TEMP/signed-candidate,dst=/input,readonly" \
            --mount "type=bind,src=$RUNNER_TEMP/signed-candidate-packet/owned-signed-debian.mjs,dst=/driver.mjs,readonly" \
            --env GITHUB_ACTIONS=true --env OPENWHISPER_OWNED_SIGNED_DEBIAN=1 \
            ubuntu:22.04@sha256:5ec03bb3441e8b0bf3b4f9cd4629a1ae763010dc3035bb8da3ae6cf026486401 \
            /bin/bash -euc '
              export DEBIAN_FRONTEND=noninteractive
              apt-get -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 -o Acquire::Retries=2 update
              apt-get -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 -o Acquire::Retries=2 install -y --no-install-recommends \
                ca-certificates util-linux libc6 libstdc++6 libgcc-s1 libgtk-3-0 libnss3 libnspr4 libasound2 libgbm1 libdrm2 \
                libx11-6 libx11-xcb1 libxcb1 libxcomposite1 libxdamage1 libxext6 libxfixes3 libxrandr2 libxkbcommon0 \
                libdbus-1-3 libatomic1 libpulse0 libsystemd0
              /usr/bin/dpkg --install /input/OpenWhisper-Linux-amd64.deb
              useradd --create-home --uid 1000 tester
              mkdir -m 755 /candidate
              cp -a /input/. /candidate/
              chown -R root:root /candidate
              chmod 755 /candidate
              chmod 444 /candidate/candidate-receipt.json /candidate/OpenWhisper-Linux-amd64.deb.sig
              mkdir -m 700 /owned-evidence
              chown 1000:1000 /owned-evidence
              cd /owned-evidence
              runuser -u tester -- env ELECTRON_RUN_AS_NODE=1 /opt/openwhisper/openwhisper /driver.mjs audit \
                --candidate /candidate --evidence /owned-evidence/positive
              runuser -u tester -- env ELECTRON_RUN_AS_NODE=1 /opt/openwhisper/openwhisper /driver.mjs audit-mutation \
                --candidate /candidate --evidence /owned-evidence/retained-mutation &
              audit_pid=$!
              mutation_deadline=$((SECONDS + 15))
              while ! test -f /owned-evidence/retained-mutation/mutation-ready.json; do
                kill -0 "$audit_pid"
                test "$SECONDS" -lt "$mutation_deadline"
                sleep 0.05
              done
              printf "%s\\n" "Owned audit mismatch fixture" >> /opt/openwhisper/notices/README.txt
              printf "MUTATED\\n" > /owned-evidence/retained-mutation/mutation-complete.partial
              mv /owned-evidence/retained-mutation/mutation-complete.partial /owned-evidence/retained-mutation/mutation-complete
              wait "$audit_pid"
              runuser -u tester -- env ELECTRON_RUN_AS_NODE=1 /opt/openwhisper/openwhisper /driver.mjs audit-mismatch \
                --candidate /candidate --evidence /owned-evidence/mismatch
            ')"
          printf '%s\n' "$original_container" > "$RUNNER_TEMP/signed-evidence/original-container.txt"
          docker start -a "$original_container"
          test "$(docker inspect --format '{{.State.ExitCode}}' "$original_container")" = 0
          test "$(docker inspect --format '{{.State.Pid}}' "$original_container")" = 0
          test "$(docker inspect --format '{{.State.OOMKilled}}' "$original_container")" = false
      - name: Retain signed-candidate admission and original namespace evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: OpenWhisper-signed-Electron-audit-${{ github.sha }}
          path: ${{ runner.temp }}/signed-evidence/
          if-no-files-found: warn
          retention-days: 14
  macos:
