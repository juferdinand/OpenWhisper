name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  macos:
    runs-on: macos-15
    timeout-minutes: 30
    defaults:
      run:
        working-directory: macos
    steps:
      - uses: actions/checkout@v4

      - name: Cache whisper.cpp
        uses: actions/cache@v4
        with:
          path: macos/Vendor
          key: whisper-${{ hashFiles('macos/scripts/fetch-whisper.sh') }}

      - name: Test
        run: make test

      - name: Build package (Universal, ad-hoc signed)
        run: make zip UNIVERSAL=1

      - name: Upload macOS package
        uses: actions/upload-artifact@v4
        with:
          name: WhisperFree-macOS-${{ github.sha }}
          path: macos/build/WhisperFree-macOS.zip
          if-no-files-found: error
          retention-days: 14
