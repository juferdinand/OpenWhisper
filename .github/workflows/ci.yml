name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '23 6 * * 1'

permissions:
  contents: read

jobs:
  macos:
    runs-on: macos-15
    timeout-minutes: 30
    defaults:
      run:
        working-directory: macos
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Cache whisper.cpp
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: macos/Vendor
          key: whisper-${{ hashFiles('macos/scripts/fetch-whisper.sh') }}

      - name: Test
        timeout-minutes: 5
        run: make test

      - name: Build package (Universal, ad-hoc signed)
        run: make release UNIVERSAL=1

      - name: Verify installation image
        run: bash scripts/verify-dmg.sh build/WhisperFree-macOS.dmg build/WhisperFree.app

      - name: Upload macOS package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: WhisperFree-macOS-${{ github.sha }}
          path: |
            macos/build/WhisperFree-macOS.dmg
            macos/build/WhisperFree-macOS.zip
          if-no-files-found: error
          retention-days: 14
