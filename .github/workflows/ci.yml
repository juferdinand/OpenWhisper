name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '23 6 * * 1'

permissions:
  contents: read

jobs:
  electron:
    name: Electron TypeScript (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            electron/package-lock.json
            shared/ui/package-lock.json
      - name: Install locked development dependencies
        run: |
          npm ci --prefix shared/ui
          npm ci --prefix electron
      - name: Check isolated Electron foundation
        working-directory: electron
        run: |
          npm run typecheck
          npm test
          npm run build
      - name: Check compiled stable migration and production stores
        if: runner.os == 'Linux'
        working-directory: electron
        run: node --import tsx tests/owned-stable-startup.ts
      - name: Install native CPU build tools (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y cmake ninja-build pkg-config libglib2.0-dev
      - name: Install native CPU build tools (macOS)
        if: runner.os == 'macOS'
        run: brew list cmake ninja >/dev/null 2>&1 || brew install cmake ninja
      - name: Check native CPU binding with pinned public audio
        working-directory: electron
        env:
          OPENWHISPER_NATIVE_TEST_MODEL: ${{ github.workspace }}/electron/.local/speech-fixtures/ggml-tiny.bin
          OPENWHISPER_NATIVE_TEST_AUDIO: ${{ github.workspace }}/electron/.local/speech-fixtures/jfk.f32
        run: |
          npm run build:native
          node --import tsx scripts/fetch-speech-fixtures.ts
          node --import tsx --test tests/native-speech.test.ts
      - name: Assemble the normal Mac recording Dev build
        if: runner.os == 'macOS'
        working-directory: electron
        run: npm run build -- --recording
      - name: Build Linux bus and check native capture without devices
        if: runner.os == 'Linux'
        working-directory: electron
        run: |
          node --import tsx scripts/build-linux-bus.ts
          node --import tsx scripts/build-capture.ts
          OPENWHISPER_CAPTURE_SYNTHETIC_ADDON="$PWD/native/capture/build/openwhisper_capture.node" \
            node --import tsx --test tests/capture.test.ts
  mac_capture:
    name: Electron owned Mac native tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-15-intel]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.21.0'
          cache: npm
          cache-dependency-path: |
            electron/package-lock.json
            shared/ui/package-lock.json
      - name: Install locked development dependencies and pinned runtime
        run: |
          npm ci --prefix shared/ui
          npm ci --prefix electron
          npm run setup --prefix electron
      - name: Check and build the isolated TypeScript host
        working-directory: electron
        run: |
          npm run typecheck
          npm test
          npm run build
      - name: Install native capture build tools
        run: brew list cmake ninja >/dev/null 2>&1 || brew install cmake ninja
      - name: Build the Apple capture edge and test generated PCM without devices
        working-directory: electron
        env:
          OPENWHISPER_OWNED_MAC_CAPTURE_TEST: '1'
          OPENWHISPER_MAC_CAPTURE_EVIDENCE: ${{ github.workspace }}/electron/.local/macos-capture-evidence
        run: |
          node --import tsx scripts/build-macos-capture.ts
          node --import tsx --test tests/owned-macos-capture.test.ts
      - name: Upload synthetic capture provenance and categorical results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Electron-macOS-capture-${{ matrix.os }}-${{ github.sha }}
          path: |
            electron/.local/macos-capture-evidence/
            electron/native/macos-capture/build/*/build-manifest.json
            electron/native/macos-capture/build/*/compile_commands.json
            electron/native/macos-capture/build/*/openwhisper_macos_capture.node
            electron/dist/native/macos-capture-notices/
          if-no-files-found: warn
          retention-days: 14
      - name: Build and test the owned Mac process retirement probe
        working-directory: electron
        env:
          OPENWHISPER_OWNED_MAC_RETIREMENT_TEST: '1'
          OPENWHISPER_MAC_RETIREMENT_EVIDENCE: ${{ github.workspace }}/electron/.local/owned-mac-retirement
        run: |
          node --import tsx scripts/build-macos-retirement.ts
          node --import tsx --test tests/owned-macos-retirement.test.ts
      - name: Upload owned Mac process retirement provenance and results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Electron-macOS-retirement-${{ matrix.os }}-${{ github.sha }}
          path: |
            electron/.local/owned-mac-retirement/
            electron/dist/native/openwhisper_macos_retirement_probe.node
            electron/dist/native/macos-retirement-probe-notices/
            electron/native/macos-retirement/build/*/compile_commands.json
          if-no-files-found: warn
          retention-days: 14
      - name: Build and test the distinct production Mac retirement role
        working-directory: electron
        env:
          OPENWHISPER_OWNED_MAC_PRODUCTION_RETIREMENT_TEST: '1'
          OPENWHISPER_MAC_PRODUCTION_RETIREMENT_EVIDENCE: ${{ github.workspace }}/electron/.local/owned-mac-production-retirement
        run: |
          node --import tsx scripts/build-macos-retirement-production.ts
          node --import tsx --test tests/owned-macos-production-retirement.test.ts
      - name: Upload production Mac retirement role provenance and results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Electron-macOS-production-retirement-${{ matrix.os }}-${{ github.sha }}
          path: |
            electron/.local/owned-mac-production-retirement/
            electron/dist/native/openwhisper_macos_retirement.node
            electron/dist/native/macos-retirement-notices/
            electron/native/macos-retirement/build-production/*/build-manifest.json
            electron/native/macos-retirement/build-production/*/compile_commands.json
            electron/native/macos-retirement/build-production/*/openwhisper_macos_retirement.node
          if-no-files-found: warn
          retention-days: 14
      - name: Assemble the per-architecture Mac recording Dev app
        working-directory: electron
        env:
          OPENWHISPER_OWNED_MAC_PACKAGE_SMOKE: '1'
        run: |
          npm run build -- --recording
          node --import tsx scripts/fetch-speech-fixtures.ts
          node --import tsx scripts/package-macos-preview.ts --output "$RUNNER_TEMP/openwhisper-mac-dev" > "$RUNNER_TEMP/openwhisper-mac-dev-result.json"
          node --import tsx tests/owned-macos-package-smoke.ts --package "$RUNNER_TEMP/openwhisper-mac-dev/OpenWhisper Dev.app" --evidence "$RUNNER_TEMP/openwhisper-mac-smoke" --fixtures "$PWD/.local/speech-fixtures"
      - name: Upload the isolated ad-hoc Mac Dev package
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: OpenWhisper-Dev-macOS-${{ matrix.os }}-${{ github.sha }}
          path: |
            ${{ runner.temp }}/openwhisper-mac-dev/*.zip
            ${{ runner.temp }}/openwhisper-mac-dev-result.json
            ${{ runner.temp }}/openwhisper-mac-smoke/result.json
            ${{ runner.temp }}/openwhisper-mac-smoke/failure.png
          if-no-files-found: error
          retention-days: 14
  linux:
    uses: ./.github/workflows/linux-build.yml
    with:
      artifact_name: OpenWhisper-Linux-development-${{ github.sha }}
  macos:
    runs-on: macos-15
    timeout-minutes: 30
    defaults:
      run:
        working-directory: macos
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'

      - name: Cache whisper.cpp
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: macos/Vendor
          key: whisper-${{ hashFiles('macos/scripts/fetch-whisper.sh') }}

      - name: Test
        timeout-minutes: 5
        run: make test

      - name: Build package (Universal, ad-hoc signed)
        run: make release UNIVERSAL=1

      - name: Verify installation image
        run: |
          bash scripts/test-signing-requirement.sh build/OpenWhisper.app
          bash scripts/verify-dmg.sh build/OpenWhisper-macOS.dmg build/OpenWhisper.app

      - name: Smoke test the shared UI in native WebKit
        timeout-minutes: 2
        env:
          WF_UI_SNAPSHOT_DIR: ${{ github.workspace }}/macos/build/ui-previews
        run: |
          build/OpenWhisper.app/Contents/MacOS/OpenWhisper --ui-smoke-test
          build/OpenWhisper.app/Contents/MacOS/OpenWhisper --overlay-smoke-test

      - name: Upload native macOS UI previews
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: OpenWhisper-native-macOS-UI-${{ github.sha }}
          path: macos/build/ui-previews/*.png
          if-no-files-found: error
          retention-days: 14

      - name: Upload macOS package
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: OpenWhisper-macOS-${{ github.sha }}
          path: |
            macos/build/OpenWhisper-macOS.dmg
            macos/build/OpenWhisper-macOS.zip
          if-no-files-found: error
          retention-days: 14
