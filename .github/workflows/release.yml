name: Release
run-name: Release ${{ inputs.version }}

# Builds the committed Electron source on both platforms, then tags that exact source commit.
# Releases are manual and start from main. Draft is enabled by default for artifact review.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Committed project version to release (e.g. 0.3.0)"
        required: true
        type: string
      draft:
        description: "Keep the release private until final artifact verification is complete"
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-22.04
    env:
      VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Validate manual main release and committed version
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/main || { echo "::error::Releases must be started from main"; exit 1; }
          [[ "$VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]] || { echo "::error::Version must use X.Y.Z format"; exit 1; }
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain --untracked-files=all)"
          test "$(cat VERSION)" = "$VERSION" || { echo "::error::Release version must already be committed in VERSION"; exit 1; }
          if git ls-remote --exit-code --tags origin "refs/tags/v$VERSION" >/dev/null 2>&1; then
            echo "::error::Tag v$VERSION already exists"; exit 1
          fi

  linux:
    needs: validate
    uses: ./.github/workflows/electron-linux-build.yml
    secrets:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
    with:
      version: ${{ inputs.version }}
      artifact_name: OpenWhisper-electron-Linux-v${{ inputs.version }}
      retention_days: 30

  macos:
    needs: validate
    uses: ./.github/workflows/electron-macos-build.yml
    secrets:
      SIGNING_CERT_P12: ${{ secrets.SIGNING_CERT_P12 }}
      SIGNING_CERT_PASSWORD: ${{ secrets.SIGNING_CERT_PASSWORD }}
    with:
      version: ${{ inputs.version }}

  publish:
    needs: [linux, macos]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    env:
      VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.21.0"
          cache: npm
          cache-dependency-path: electron/package-lock.json
      - name: Install locked publication validator dependencies
        run: npm ci --prefix electron
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: OpenWhisper-electron-macOS-v${{ inputs.version }}
          path: ${{ runner.temp }}/release-input/macos
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: OpenWhisper-electron-Linux-v${{ inputs.version }}
          path: ${{ runner.temp }}/release-input/linux
      - name: Validate exact builder artifacts and stage canonical assets
        working-directory: electron
        env:
          MACOS_DIR: ${{ runner.temp }}/release-input/macos
          LINUX_DIR: ${{ runner.temp }}/release-input/linux
          ASSETS_DIR: ${{ runner.temp }}/release-assets
        run: |
          set -euo pipefail
          node --import tsx scripts/validate-release-publication.ts \
            --version "$VERSION" --commit "$GITHUB_SHA" --macos-dir "$MACOS_DIR" \
            --linux-dir "$LINUX_DIR" --output-dir "$ASSETS_DIR"
      - name: Confirm main still identifies the tested source and create its tag
        shell: bash
        run: |
          set -euo pipefail
          remote_main="$(git ls-remote --exit-code origin refs/heads/main | awk 'NR == 1 { print $1 }')"
          test "$remote_main" = "$GITHUB_SHA" || { echo "::error::main moved after release builds; refusing to publish stale artifacts"; exit 1; }
          if git ls-remote --exit-code --tags origin "refs/tags/v$VERSION" >/dev/null 2>&1; then
            echo "::error::Tag v$VERSION already exists"; exit 1
          fi
          git tag "v$VERSION" "$GITHUB_SHA"
      - name: Push the exact source and tag atomically, then create the release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_DRAFT: ${{ inputs.draft }}
          ASSETS_DIR: ${{ runner.temp }}/release-assets
        shell: bash
        run: |
          set -euo pipefail
          git push --atomic --force-with-lease="refs/heads/main:$GITHUB_SHA" origin \
            "$GITHUB_SHA:refs/heads/main" "refs/tags/v$VERSION"
          EXTRA_ARGS=()
          if [[ "$RELEASE_DRAFT" == "true" ]]; then EXTRA_ARGS+=(--draft); fi
          gh release create "v$VERSION" \
            "$ASSETS_DIR/OpenWhisper-macOS.dmg" \
            "$ASSETS_DIR/OpenWhisper-macOS.zip" \
            "$ASSETS_DIR/OpenWhisper-Linux-x86_64.AppImage" \
            "$ASSETS_DIR/OpenWhisper-Linux-amd64.deb" \
            "$ASSETS_DIR/OpenWhisper-Linux-x86_64.AppImage.sig" \
            "$ASSETS_DIR/OpenWhisper-Linux-amd64.deb.sig" \
            "$ASSETS_DIR/latest.json" "$ASSETS_DIR/SHA256SUMS" \
            --title "OpenWhisper $VERSION" --verify-tag \
            --notes-file .github/release-notes.md --generate-notes "${EXTRA_ARGS[@]}"
