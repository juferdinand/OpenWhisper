name: Release
run-name: Release ${{ inputs.version }}

# Start manually: Actions → Release → Run workflow → enter a version (e.g. 0.2.0).
# Writes VERSION, commits, tags v<version>, builds a signed universal app, and
# publishes it as a GitHub release. Installed apps discover the update automatically.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "New version (e.g. 0.2.0)"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # Future platforms (desktop/: Linux, Windows) will have separate jobs that upload
  # their assets to the same release; see docs/PLATFORMS.md.
  macos:
    runs-on: macos-15
    timeout-minutes: 30
    env:
      VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'

      - name: Validate version
        run: |
          if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "::error::Releases must be started from the main branch"; exit 1
          fi
          if ! [[ "$VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "::error::Version must use X.Y.Z format (received: $VERSION)"; exit 1
          fi
          if git rev-parse "v$VERSION" >/dev/null 2>&1; then
            echo "::error::Tag v$VERSION already exists"; exit 1
          fi

      # Download release dependencies fresh and verify SHA-256; no build cache.
      - name: Tests
        timeout-minutes: 5
        working-directory: macos
        run: make test

      - name: Import signing certificate
        env:
          CERT_P12: ${{ secrets.SIGNING_CERT_P12 }}
          CERT_PASSWORD: ${{ secrets.SIGNING_CERT_PASSWORD }}
        run: |
          if [[ -z "$CERT_P12" || -z "$CERT_PASSWORD" ]]; then
            echo "::error::SIGNING_CERT_P12 or SIGNING_CERT_PASSWORD is missing; see macos/scripts/export-dev-cert.sh"; exit 1
          fi
          umask 077
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          echo "::add-mask::$KEYCHAIN_PASSWORD"
          echo "$CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" -P "$CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          rm "$RUNNER_TEMP/cert.p12"
          SIGN_IDENTITY="$(security find-identity -p codesigning "$KEYCHAIN" | awk '/^[[:space:]]*[0-9]+\)/ { print $2; exit }')"
          if [[ -z "$SIGN_IDENTITY" ]]; then
            echo "::error::No code-signing identity found in the release keychain"; exit 1
          fi
          echo "SIGN_IDENTITY=$SIGN_IDENTITY" >> "$GITHUB_ENV"

      - name: Set version, commit, and tag
        run: |
          python3 desktop/scripts/set-version.py "$VERSION"
          python3 desktop/scripts/check-assets.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet -- VERSION desktop; then
            git add VERSION desktop/Cargo.toml desktop/Cargo.lock desktop/package.json desktop/package-lock.json desktop/src-tauri/tauri.conf.json
            git commit -m "Release v$VERSION"
          fi
          git tag "v$VERSION"

      - name: Build and sign universal app
        working-directory: macos
        run: make release UNIVERSAL=1 UPDATE_REPO="${{ github.repository }}"

      - name: Verify signatures
        working-directory: macos
        run: |
          codesign --verify --deep --strict --verbose=2 build/WhisperFree.app
          codesign -dr - build/WhisperFree.app
          bash scripts/test-release-signature.sh build/WhisperFree.app
          lipo build/WhisperFree.app/Contents/MacOS/WhisperFree -verify_arch arm64 x86_64
          # Use the updater's extraction tool: signatures must survive the ZIP round trip.
          mkdir "$RUNNER_TEMP/release-verification"
          /usr/bin/tar -xf build/WhisperFree-macOS.zip -C "$RUNNER_TEMP/release-verification" --no-same-owner
          codesign --verify --deep --strict --verbose=2 "$RUNNER_TEMP/release-verification/WhisperFree.app"
          bash scripts/verify-dmg.sh build/WhisperFree-macOS.dmg build/WhisperFree.app
          cd build
          shasum -a 256 WhisperFree-macOS.dmg WhisperFree-macOS.zip > SHA256SUMS

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: WhisperFree-macOS-v${{ inputs.version }}
          path: |
            macos/build/WhisperFree-macOS.dmg
            macos/build/WhisperFree-macOS.zip
            macos/build/SHA256SUMS
          if-no-files-found: error
          retention-days: 30

      - name: Smoke test shared UI
        timeout-minutes: 2
        working-directory: macos
        run: build/WhisperFree.app/Contents/MacOS/WhisperFree --ui-smoke-test

      - name: Push and publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git push --atomic origin HEAD:refs/heads/main "refs/tags/v$VERSION"
          gh release create "v$VERSION" macos/build/WhisperFree-macOS.dmg macos/build/WhisperFree-macOS.zip macos/build/SHA256SUMS \
            --title "WhisperFree $VERSION" \
            --verify-tag \
            --notes-file .github/release-notes.md \
            --generate-notes

      - name: Clean up keychain
        if: always()
        run: security delete-keychain "$RUNNER_TEMP/signing.keychain-db" 2>/dev/null || true
