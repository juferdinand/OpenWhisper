name: Release
run-name: Release ${{ inputs.version }}

# Manuell starten: Actions → Release → Run workflow → Version eingeben (z. B. 0.2.0).
# Schreibt VERSION, committet, taggt v<Version>, baut eine signierte Universal-App und
# veröffentlicht sie als GitHub-Release. Installierte Apps finden das Update automatisch.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Neue Version (z. B. 0.2.0)"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # Weitere Plattformen (desktop/: Linux, Windows) kommen als eigene Jobs dazu und laden
  # ihre Artefakte in dasselbe Release hoch – siehe docs/PLATFORMS.md.
  macos:
    runs-on: macos-15
    timeout-minutes: 30
    env:
      VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Version prüfen
        run: |
          if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "::error::Releases müssen vom main-Branch gestartet werden"; exit 1
          fi
          if ! [[ "$VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "::error::Version muss die Form X.Y.Z haben (bekommen: $VERSION)"; exit 1
          fi
          if git rev-parse "v$VERSION" >/dev/null 2>&1; then
            echo "::error::Tag v$VERSION existiert bereits"; exit 1
          fi

      # Release-Abhängigkeiten frisch laden und per SHA-256 prüfen; kein Build-Cache.
      - name: Tests
        timeout-minutes: 5
        working-directory: macos
        run: make test

      - name: Signier-Zertifikat importieren
        env:
          CERT_P12: ${{ secrets.SIGNING_CERT_P12 }}
          CERT_PASSWORD: ${{ secrets.SIGNING_CERT_PASSWORD }}
        run: |
          if [[ -z "$CERT_P12" || -z "$CERT_PASSWORD" ]]; then
            echo "::error::SIGNING_CERT_P12 oder SIGNING_CERT_PASSWORD fehlt – siehe macos/scripts/export-dev-cert.sh"; exit 1
          fi
          umask 077
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          echo "::add-mask::$KEYCHAIN_PASSWORD"
          echo "$CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" -P "$CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          rm "$RUNNER_TEMP/cert.p12"
          SIGN_IDENTITY="$(security find-identity -p codesigning "$KEYCHAIN" | awk '/^[[:space:]]*[0-9]+\)/ { print $2; exit }')"
          if [[ -z "$SIGN_IDENTITY" ]]; then
            echo "::error::Keine Code-Signing-Identität im Release-Schlüsselbund gefunden"; exit 1
          fi
          echo "SIGN_IDENTITY=$SIGN_IDENTITY" >> "$GITHUB_ENV"

      - name: Version setzen, committen, taggen
        run: |
          echo "$VERSION" > VERSION
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet -- VERSION; then
            git add VERSION
            git commit -m "Release v$VERSION"
          fi
          git tag "v$VERSION"

      - name: Universal-App bauen und signieren
        working-directory: macos
        run: make release UNIVERSAL=1 UPDATE_REPO="${{ github.repository }}"

      - name: Signatur prüfen
        working-directory: macos
        run: |
          codesign --verify --deep --strict --verbose=2 build/WhisperFree.app
          codesign -dr - build/WhisperFree.app
          bash scripts/test-release-signature.sh build/WhisperFree.app
          lipo -verify_arch arm64 x86_64 build/WhisperFree.app/Contents/MacOS/WhisperFree
          # Dasselbe Entpackwerkzeug wie der Updater: Signatur muss den ZIP-Rundweg überstehen.
          mkdir "$RUNNER_TEMP/release-verification"
          /usr/bin/tar -xf build/WhisperFree-macOS.zip -C "$RUNNER_TEMP/release-verification" --no-same-owner
          codesign --verify --deep --strict --verbose=2 "$RUNNER_TEMP/release-verification/WhisperFree.app"
          cd build
          shasum -a 256 WhisperFree-macOS.zip > SHA256SUMS

      - name: Paket als Workflow-Artefakt sichern
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: WhisperFree-macOS-v${{ inputs.version }}
          path: |
            macos/build/WhisperFree-macOS.zip
            macos/build/SHA256SUMS
          if-no-files-found: error
          retention-days: 30

      - name: Pushen und Release veröffentlichen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git push --atomic origin HEAD:refs/heads/main "refs/tags/v$VERSION"
          gh release create "v$VERSION" macos/build/WhisperFree-macOS.zip macos/build/SHA256SUMS \
            --title "WhisperFree $VERSION" \
            --verify-tag \
            --notes-file .github/release-notes.md \
            --generate-notes

      - name: Keychain aufräumen
        if: always()
        run: security delete-keychain "$RUNNER_TEMP/signing.keychain-db" 2>/dev/null || true
