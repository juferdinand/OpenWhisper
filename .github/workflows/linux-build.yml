name: Linux build

on:
  workflow_call:
    secrets:
      TAURI_SIGNING_PRIVATE_KEY:
        required: false
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD:
        required: false
    inputs:
      version:
        description: Optional release version to apply before building
        type: string
        default: ''
      artifact_name:
        type: string
        required: true
      retention_days:
        type: number
        default: 14

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    defaults:
      run:
        working-directory: linux
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set release version
        if: inputs.version != ''
        env:
          VERSION: ${{ inputs.version }}
        run: python3 scripts/set-version.py "$VERSION"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            linux/package-lock.json
            shared/ui/package-lock.json
      - name: Install Linux build dependencies
        timeout-minutes: 10
        run: |
          # The runner's Azure HTTP mirror can stall before index downloads.
          # Keep Ubuntu suites/components and signature checks; use official HTTPS.
          sudo python3 - <<'PYTHON'
          from pathlib import Path
          files = [Path("/etc/apt/apt-mirrors.txt"), Path("/etc/apt/sources.list")]
          files += list(Path("/etc/apt/sources.list.d").glob("*.list"))
          files += list(Path("/etc/apt/sources.list.d").glob("*.sources"))
          for path in files:
              if path.is_file():
                  source = path.read_text()
                  updated = source.replace("http://azure.archive.ubuntu.com/ubuntu", "https://archive.ubuntu.com/ubuntu")
                  if source != updated:
                      path.write_text(updated)
          PYTHON
          sudo apt-get -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 -o Acquire::Retries=2 update
          sudo apt-get -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 -o Acquire::Retries=2 install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev libasound2-dev librsvg2-dev libssl-dev libxkbcommon-dev libgtk-layer-shell0 libvulkan-dev patchelf binutils cmake ninja-build ffmpeg xvfb dbus-x11 openssl squashfs-tools desktop-file-utils
          rustup toolchain install 1.99.0 --profile minimal --component rustfmt,clippy
          rustup default 1.99.0
      - name: Test the terminal installers in disposable homes
        run: |
          python3 scripts/test-local-installer.py
          python3 scripts/test-release-installer.py
      - name: Cache native source and test model
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            linux/vendor
            linux/target/speech-smoke
          key: linux-speech-${{ hashFiles('linux/native/*-source.json', 'linux/native/vulkan-headers.json', 'linux/scripts/build-glslc.py', 'linux/scripts/test-recognition.sh') }}
      - name: Build the pinned Vulkan shader compiler
        run: |
          python3 scripts/build-glslc.py
          echo "$PWD/vendor/shaderc/bin" >> "$GITHUB_PATH"
      - name: Prepare and verify frontend
        run: |
          bash scripts/fetch-native.sh
          python3 scripts/check-assets.py
          npm ci
          npm run build
          cd ../shared/ui
          npx playwright install --with-deps chromium
          npm run test:ui
      - name: Test Linux backend
        run: |
          cargo fmt --all --check
          cargo test --locked --workspace
          cargo clippy --locked --workspace --all-targets -- -D warnings
          cargo build --locked -p openwhisper-core --example verify-update
          python3 scripts/test-update-signatures.py
          OPENWHISPER_UPDATE_VERIFIER="$PWD/target/debug/examples/verify-update" python3 scripts/test-release-installer.py ReleaseInstallerTests.test_native_verifier_matches_signature_and_version_decisions
          bash scripts/test-recognition.sh
      - name: Export the existing locked update signer and verifier
        if: inputs.version == ''
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          if test -n "$(git status --porcelain)"; then git status --short; exit 1; fi
          packet="$RUNNER_TEMP/openwhisper-update-tools"
          test ! -e "$packet"
          mkdir -m 700 -p "$packet/node_modules/@tauri-apps"
          cp -a target/debug/examples/verify-update "$packet/verify-update"
          cp src-tauri/tauri.conf.json package.json package-lock.json "$packet/"
          cp -a node_modules/@tauri-apps/cli node_modules/@tauri-apps/cli-linux-x64-gnu "$packet/node_modules/@tauri-apps/"
          git rev-parse HEAD > "$packet/source-commit.txt"
          (
            cd "$packet"
            find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS
          )
          tar -C "$packet" -cf "$RUNNER_TEMP/openwhisper-update-tools.tar" .
      - name: Upload the same-run locked update tools
        if: inputs.version == ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: OpenWhisper-Linux-update-tools-${{ github.sha }}
          path: ${{ runner.temp }}/openwhisper-update-tools.tar
          if-no-files-found: error
          retention-days: ${{ inputs.retention_days }}
      - name: Build Linux packages
        env:
          APPIMAGE_EXTRACT_AND_RUN: '1'
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          if [[ -n "$RELEASE_VERSION" ]]; then npm run bundle:linux:release; else npm run bundle:linux; fi
      - name: Verify the actual AppImage overlay runtime and notices
        run: python3 scripts/verify-appimage.py target/release/bundle/appimage/*.AppImage
      - name: Sign and verify Linux release updates
        if: inputs.version != ''
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: python3 scripts/prepare-linux-update.py
      - name: Verify CPU fallback in the Vulkan build
        env:
          GGML_DISABLE_VULKAN: '1'
        run: bash scripts/test-recognition.sh --release --features vulkan
      - name: Verify and checksum packages
        run: |
          dpkg-deb --info target/release/bundle/deb/*.deb
          dpkg-deb --contents target/release/bundle/deb/*.deb | grep 'usr/share/applications/io.github.whisperfree.desktop'
          cd target/release/bundle
          sha256sum deb/*.deb appimage/*.AppImage > SHA256SUMS
      - name: Smoke test the shared UI in native WebKitGTK
        timeout-minutes: 2
        env:
          XDG_CONFIG_HOME: ${{ runner.temp }}/openwhisper-ui/config
          XDG_DATA_HOME: ${{ runner.temp }}/openwhisper-ui/data
        run: dbus-run-session -- xvfb-run -a target/release/openwhisper-desktop --ui-smoke-test
      - name: Upload Linux release packages
        if: inputs.version != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ inputs.artifact_name }}
          path: linux/target/release/bundle/release/*
          if-no-files-found: error
          retention-days: ${{ inputs.retention_days }}
      - name: Upload Linux packages
        if: inputs.version == ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ inputs.artifact_name }}
          path: |
            linux/target/release/bundle/deb/*.deb
            linux/target/release/bundle/appimage/*.AppImage
            linux/target/release/bundle/SHA256SUMS
          if-no-files-found: error
          retention-days: ${{ inputs.retention_days }}
      - name: Upload shared UI previews
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: OpenWhisper-shared-UI-${{ github.sha }}
          path: shared/ui/test-results/*.png
          retention-days: ${{ inputs.retention_days }}
